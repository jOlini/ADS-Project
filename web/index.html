<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Monograma da OliFine (web/public/olifine.svg). O Vite acrescenta o base
         (/ADS-Project/) no build. -->
    <link rel="icon" type="image/svg+xml" href="/olifine.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OliFine: tecnologia a favor do seu dinheiro. Controle financeiro pessoal." />
    <meta name="color-scheme" content="light dark" />
    <!-- Mesma cor da barra do topo em cada tema (tokens em src/estilos/tokens.css).
         Com o tema escolhido no botão, src/servicos/tema.js troca as duas. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131c18" media="(prefers-color-scheme: dark)" />
    <title>OliFine</title>
    <!-- Tema (claro ou escuro) antes da primeira pintura, sem piscar. Arquivo
         próprio (web/public), e não script inline: a CSP do build só aceita script
         do site. O Vite acrescenta o base, como no ícone. -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
