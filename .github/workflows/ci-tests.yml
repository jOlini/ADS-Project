name: CI - Testes

# Roda os testes unitários a cada commit enviado para uma pull request
# (abrir, reabrir e cada push novo na branch = "synchronize") e em todo push
# na main. No final, avisa no Discord se os testes passaram ou não.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Commit novo na mesma PR cancela a execução anterior que ainda estiver rodando.
concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-web:
    name: Testes do front-end (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Rodar o lint (oxlint)
        run: npm run lint

      # --run força o modo de execução única. Sem ele o Vitest entra em modo
      # observador e o job ficaria pendurado até estourar o tempo limite.
      - name: Rodar os testes unitários
        run: npm test -- --run

      - name: Gerar o build de produção
        run: npm run build

  testes-api:
    name: Testes da API (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt

      # Os testes usam um repositório em memória: não precisam de MongoDB.
      - name: Rodar os testes unitários
        run: pytest -v

  alerta:
    name: Alerta de status no Discord
    needs: [testes-web, testes-api]
    # Roda com os testes aprovados ou reprovados; só não roda se a execução
    # foi cancelada por um commit mais novo (evita alerta repetido).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Enviar o resultado para o webhook do Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RESULTADO_WEB: ${{ needs.testes-web.result }}
          RESULTADO_API: ${{ needs.testes-api.result }}
          REPOSITORIO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTOR: ${{ github.actor }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # PR aberta de um fork não recebe secrets: avisa no log e não falha.
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Secret DISCORD_WEBHOOK não configurado: alerta não enviado."
            exit 0
          fi

          if [ "$RESULTADO_WEB" = "success" ] && [ "$RESULTADO_API" = "success" ]; then
            TITULO="✅ Testes aprovados"
            COR=3066993
          else
            TITULO="❌ Testes reprovados"
            COR=15158332
          fi

          if [ "$EVENTO" = "pull_request" ]; then
            ORIGEM="PR #$PR_NUMERO: $PR_TITULO"
          else
            ORIGEM="Push na $BRANCH"
          fi

          # Os valores entram no JSON pelo jq (--arg), nunca colados na string:
          # um título de PR com aspas não quebra nem injeta nada no payload.
          jq -n \
            --arg titulo "$TITULO" \
            --arg cor "$COR" \
            --arg origem "$ORIGEM" \
            --arg web "$RESULTADO_WEB" \
            --arg api "$RESULTADO_API" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg autor "$AUTOR" \
            --arg execucao "$EXECUCAO" \
            --arg repositorio "$REPOSITORIO" \
            '{embeds: [{
              title: $titulo,
              url: $execucao,
              color: ($cor | tonumber),
              description: $origem,
              fields: [
                {name: "Front-end (Vitest)", value: $web, inline: true},
                {name: "API (pytest)", value: $api, inline: true},
                {name: "Branch", value: $branch, inline: true},
                {name: "Commit", value: $commit[0:7], inline: true},
                {name: "Autor", value: $autor, inline: true}
              ],
              footer: {text: $repositorio}
            }]}' \
          | curl --silent --show-error --fail \
              --request POST "$WEBHOOK" \
              --header "Content-Type: application/json" \
              --data @-
