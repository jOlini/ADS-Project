# nginx do container do front-end.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A versão do nginx não aparece no cabeçalho Server nem nas páginas de erro.
    server_tokens off;

    # Cabeçalhos de segurança (Sistemas Web Seguros), em toda resposta ("always"
    # vale também para 404). A CSP de script vem numa <meta> do build
    # (vite.config.js), a mesma do GitHub Pages; aqui ficam as diretivas que só
    # funcionam como cabeçalho:
    # - frame-ancestors e X-Frame-Options: nenhum site embute o app num <iframe>
    #   (clickjacking);
    # - nosniff: o navegador não "adivinha" o tipo de um arquivo;
    # - Referrer-Policy: o endereço completo não vaza para outros sites;
    # - Permissions-Policy: câmera, microfone, localização e pagamento desligados.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # SPA: /cadastro, /login e /principal não existem como arquivo. Quem
    # resolve a rota é o React Router, no navegador. Sem este fallback,
    # recarregar a página em /principal daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
