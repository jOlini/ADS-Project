name: CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cada action fica presa ao SHA do commit, com a versão no comentário ao
# lado. Uma tag (@v4) pode ser movida para outro código por quem controlar o
# repositório da action, e o workflow rodaria esse código com os secrets e o
# token do repositório (ataque de cadeia de suprimentos, como o do
# tj-actions/changed-files em 2025). O SHA não muda. Para atualizar:
#   git ls-remote --tags https://github.com/actions/<action> "v4*"
# e trocar o SHA e o comentário juntos.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Sem guardar o token no .git/config: nenhum passo faz push.
        with:
          persist-credentials: false

      - name: Preparar o Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar as dependências
        run: npm ci
        working-directory: web

      - name: Gerar o build de produção
        run: npm run build
        working-directory: web
        # Configuração do app Web do Firebase (ver web/.env.example). É pública
        # por natureza, mas fica nos secrets do repositório para não ser versionada.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Caminho e API do site publicado: variáveis do repositório (vars),
          # não secrets, porque nenhuma é segredo. Vazias, o build é o de
          # sempre: /ADS-Project/ e sem API. Com domínio próprio no Pages,
          # VITE_BASE=/ (o site passa a morar na raiz do domínio).
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # O Pages só conhece arquivos: /ADS-Project/principal não existe no
      # disco e daria 404 ao recarregar. Um 404.html igual ao index.html faz o
      # app abrir em qualquer rota e o React Router resolve o caminho.
      - name: Criar o fallback de rotas da SPA
        run: cp web/dist/index.html web/dist/404.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Empacotar o resultado do build
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
