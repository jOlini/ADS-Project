name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Rodar os testes unitários
        run: npm test -- --run --passWithNoTests

      - name: Gerar o build de produção
        run: npm run build
