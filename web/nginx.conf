# nginx do container do front-end.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: /cadastro, /login e /principal não existem como arquivo. Quem
    # resolve a rota é o React Router, no navegador. Sem este fallback,
    # recarregar a página em /principal daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
