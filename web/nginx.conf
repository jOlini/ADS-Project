# nginx do container do front-end.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A versão do nginx não aparece no cabeçalho Server nem nas páginas de erro.
    server_tokens off;

    # Cabeçalhos de segurança (Sistemas Web Seguros), em toda resposta ("always"
    # vale também para 404). A CSP de script vem numa <meta> do build
    # (vite.config.js), a mesma do GitHub Pages; aqui ficam as diretivas que só
    # funcionam como cabeçalho:
    # - frame-ancestors e X-Frame-Options: nenhum site embute o app num <iframe>
    #   (clickjacking);
    # - nosniff: o navegador não "adivinha" o tipo de um arquivo;
    # - Referrer-Policy: o endereço completo não vaza para outros sites;
    # - Permissions-Policy: câmera, microfone, localização e pagamento desligados.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # SPA: /cadastro, /login e /principal não existem como arquivo. Quem
    # resolve a rota é o React Router, no navegador. Sem este fallback,
    # recarregar a página em /principal daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pelo túnel da Cloudflare ("python subir-app.py prod" e depois
    # "tunnel start"), só esta porta fica pública, e a página chama a API em
    # /api/espacos... (src/servicos/enderecoDaApi.js). O nginx repassa só as
    # rotas do cliente ao serviço "api" do docker compose: painel
    # administrativo, login do back-office e Swagger continuam fora do
    # endereço público. O caminho chega aqui já normalizado ("/api/espacos/../
    # auth" vira "/api/auth" e cai no index.html acima).
    # O resolver do Docker (127.0.0.11) e a variável adiam a busca do nome
    # "api" para a hora do pedido: fora do compose (um "docker run" sozinho),
    # o nginx sobe normalmente e só /api/espacos responde 502.
    location ^~ /api/espacos {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:8081;
        rewrite ^/api(/espacos.*)$ $1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
