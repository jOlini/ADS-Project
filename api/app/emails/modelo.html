<!doctype html>
<!--
  Modelo único dos e-mails da OliFine (mensagens.py preenche os campos marcados com cifrão).

  E-mail não é página: Gmail e Outlook ignoram boa parte do CSS moderno. Por
  isso o layout é de tabelas, com o estilo escrito em cada elemento (inline);
  o bloco <style> só acrescenta o que alguns programas entendem (celular e
  modo escuro) e nunca é necessário para ler. Nenhuma imagem: com imagens
  bloqueadas (padrão em vários programas), a marca continua de pé em texto.

  Cores da identidade OliFine (DESIGN.md): faixa Deep Emerald #1F5746 com o
  nome em branco e o slogan em Signal Green Bright #84D2A5; botão Action Green
  #2B7857 com texto branco (5,3:1); texto Slate Ink #1A2430 sobre branco; fundo
  Surface Light #F8FAFC; bordas Hairline #E2E8F0; cantos de 16px no cartão e
  12px no botão. No modo escuro, a ação vira o sálvia claro #78C89E com tinta
  #071A13, como no app.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>$titulo</title>
<style>
  body { margin: 0; padding: 0; width: 100%; background: #F8FAFC; }
  a { color: #2B7857; }
  @media (max-width: 600px) {
    .faixa, .cartao, .rodape { padding-left: 22px !important; padding-right: 22px !important; }
    .titulo { font-size: 22px !important; }
  }
  @media (prefers-color-scheme: dark) {
    body, .fundo { background: #0C1311 !important; }
    .faixa { background: #143C31 !important; }
    .cartao { background: #131C18 !important; border-color: #222F29 !important; }
    .texto, .titulo { color: #E1EBE6 !important; }
    .suave { color: #9CACA4 !important; }
    .link { color: #78C89E !important; }
    .botao, .botao a { background: #78C89E !important; color: #071A13 !important; }
    .caixa { background: #1B3A2D !important; border-color: #2B5A45 !important; color: #A3E2BF !important; }
    .divisa { border-color: #222F29 !important; }
  }
</style>
</head>
<body class="fundo" style="margin:0;padding:0;width:100%;background:#F8FAFC;">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">$previa&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="fundo" style="background:#F8FAFC;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td class="faixa" style="background:#1F5746;border-radius:16px 16px 0 0;padding:26px 36px;">
            <p style="margin:0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;line-height:1.1;font-weight:700;letter-spacing:-0.6px;color:#FFFFFF;">OliFine</p>
            <p style="margin:6px 0 0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.4;font-weight:600;color:#84D2A5;">Tecnologia a favor do seu dinheiro</p>
          </td>
        </tr>
        <tr>
          <td class="cartao" style="background:#FFFFFF;border:1px solid #E2E8F0;border-top:0;border-radius:0 0 16px 16px;padding:36px;">
            <h1 class="titulo" style="margin:0 0 16px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.6px;color:#1A2430;">$titulo</h1>
$conteudo
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;">
              <tr>
                <td class="botao" style="border-radius:12px;background:#2B7857;">
                  <a href="$link" target="_blank" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#2B7857;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1;font-weight:600;color:#FFFFFF;text-decoration:none;">$rotulo</a>
                </td>
              </tr>
            </table>
            <p class="suave" style="margin:16px 0 0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;color:#626E7F;">Se o botão não abrir, copie este endereço no navegador:<br><a class="link" href="$link" target="_blank" style="color:#2B7857;word-break:break-all;">$link</a></p>
            <p class="suave divisa" style="margin:28px 0 0;padding-top:20px;border-top:1px solid #E2E8F0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;color:#626E7F;">$aviso</p>
          </td>
        </tr>
        <tr>
          <td class="rodape" style="padding:20px 36px 0;">
            <p class="suave" style="margin:0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.55;color:#626E7F;">E-mail automático da OliFine. A OliFine nunca pede a sua senha por e-mail, mensagem ou telefone.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
