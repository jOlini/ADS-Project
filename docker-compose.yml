# Back-end completo para desenvolvimento e demonstração: MongoDB + API.
# Antes: copiar api/.env.example para api/.env e trocar os valores
# (o "python subir-app.py dev" cria o api/.env sozinho na primeira vez).
# Subir: docker compose up --build   ·   API em http://localhost:8081
# Com os e-mails da conta ligados, prefira o "python subir-app.py dev": ele
# monta a chave da conta de serviço no container (.subir-app/compose.local.yml);
# o caminho do Windows no api/.env não existe dentro dele.

services:
  mongo:
    image: mongo:7
    volumes:
      - dados-mongo:/data/db
    # Sem "ports": o banco só é alcançável pela rede interna do compose,
    # nunca pela máquina host nem pela rede local.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./api
    env_file: ./api/.env
    environment:
      # Sobrescreve o MONGODB_URI do .env: dentro do compose o banco é o
      # serviço "mongo", não o localhost.
      MONGODB_URI: mongodb://mongo:27017/pessoal-finance
      # Origem da área do cliente aberta pela rede local (http://<ip>:5173),
      # somada ao CORS_ORIGENS. O "python subir-app.py" preenche com o IP
      # desta máquina; num "docker compose up" direto, fica vazia.
      CORS_ORIGENS_REDE: ${CORS_ORIGENS_REDE:-}
    ports:
      - "8081:8081"
    # A API só sobe depois que o MongoDB responde ao ping.
    depends_on:
      mongo:
        condition: service_healthy
    # /saude responde em qualquer AMBIENTE (o /openapi.json sai do ar em
    # produção) e não consulta o banco.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/saude', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  dados-mongo:
